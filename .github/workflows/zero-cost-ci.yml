name: Zero-cost tests and distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: av-toolkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      OPENAI_API_KEY: ''
      ACOUSTID_API_KEY: ''
      AVE_RUN_NETWORK_INTEGRATION: '0'
      AVE_ENABLE_PAID_TESTS: '0'
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The external AAC materialization fixtures are validated against 8.1.1.
          # 9.0.2 changes decoded preroll and retains explicit partial coverage.
          choco install ffmpeg --version=8.1.1 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -version
          ffprobe -version
          $avCiFFmpegVersion = (ffmpeg -version | Select-Object -First 1)
          if ($avCiFFmpegVersion -notmatch '^ffmpeg version 8\.1\.1(?:-|\s)') {
            throw 'Expected the validated FFmpeg 8.1.1 Windows binary'
          }
      - name: Install dependencies from repository metadata
        run: python -m pip install ".[all,reuse-parquet,dev]"
      - name: Check Python syntax
        run: python -m compileall -q avevidence scripts tests
      - name: Scan public source
        run: python scripts/scan_public_source.py
      - name: Run synthetic regression suite
        shell: bash
        env:
          # runner context is available here, not at job-level env evaluation.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: python scripts/self_test.py --report-dir "$RUNNER_TEMP/regression"
      - name: Build and verify wheel and source distribution
        shell: bash
        run: python scripts/build_distributions.py --output "$RUNNER_TEMP/distributions"
      - name: Preserve test and build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-cost-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/regression
            ${{ runner.temp }}/distributions/*.whl
            ${{ runner.temp }}/distributions/*.tar.gz
            ${{ runner.temp }}/distributions/BUILD_PROVENANCE.json
            ${{ runner.temp }}/distributions/SHA256SUMS
          if-no-files-found: warn
